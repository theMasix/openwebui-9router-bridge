apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openwebui-9router-bridge.fullname" . }}
  labels:
    {{- include "openwebui-9router-bridge.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openwebui-9router-bridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openwebui-9router-bridge.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openwebui-9router-bridge.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.bridge.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "openwebui-9router-bridge.fullname" . }}-config
          {{- if or .Values.bridge.existingSecret .Values.bridge.inboundApiKey .Values.bridge.ninerouterApiKey .Values.extraEnv }}
          env:
            {{- if or .Values.bridge.existingSecret .Values.bridge.inboundApiKey }}
            - name: BRIDGE_INBOUND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openwebui-9router-bridge.secretName" . }}
                  key: INBOUND_API_KEY
                  optional: true
            {{- end }}
            {{- if or .Values.bridge.existingSecret .Values.bridge.ninerouterApiKey }}
            - name: BRIDGE_NINEROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openwebui-9router-bridge.secretName" . }}
                  key: NINEROUTER_API_KEY
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
