{{- if and (not .Values.bridge.existingSecret) (or .Values.bridge.inboundApiKey .Values.bridge.ninerouterApiKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwebui-9router-bridge.fullname" . }}
  labels:
    {{- include "openwebui-9router-bridge.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.bridge.inboundApiKey }}
  INBOUND_API_KEY: {{ .Values.bridge.inboundApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.bridge.ninerouterApiKey }}
  NINEROUTER_API_KEY: {{ .Values.bridge.ninerouterApiKey | b64enc | quote }}
  {{- end }}
{{- end }}
